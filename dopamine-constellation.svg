<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="Dopamine molecule drawn as a constellation">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd6f5" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f9a8d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fb7185" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ddd6fe" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background starfield -->
  <g fill="#fbcfe8">
    <circle cx="18" cy="30" r="1.1" opacity="0.5"/><circle cx="52" cy="88" r="0.7" opacity="0.35"/>
    <circle cx="30" cy="150" r="0.9" opacity="0.4"/><circle cx="66" cy="205" r="1.2" opacity="0.55"/>
    <circle cx="12" cy="228" r="0.6" opacity="0.3"/><circle cx="98" cy="22" r="0.8" opacity="0.4"/>
    <circle cx="210" cy="18" r="1" opacity="0.45"/><circle cx="258" cy="42" r="0.6" opacity="0.3"/>
    <circle cx="300" cy="22" r="0.9" opacity="0.4"/><circle cx="348" cy="48" r="1.1" opacity="0.5"/>
    <circle cx="392" cy="28" r="0.7" opacity="0.35"/><circle cx="430" cy="60" r="1" opacity="0.45"/>
    <circle cx="462" cy="30" r="0.6" opacity="0.3"/><circle cx="418" cy="110" r="0.8" opacity="0.35"/>
    <circle cx="452" cy="150" r="1.1" opacity="0.5"/><circle cx="428" cy="200" r="0.7" opacity="0.35"/>
    <circle cx="462" cy="232" r="0.9" opacity="0.4"/><circle cx="380" cy="222" r="1.2" opacity="0.5"/>
    <circle cx="340" cy="200" r="0.6" opacity="0.3"/><circle cx="300" cy="228" r="0.8" opacity="0.4"/>
    <circle cx="252" cy="205" r="1" opacity="0.45"/><circle cx="208" cy="228" r="0.7" opacity="0.3"/>
    <circle cx="160" cy="210" r="0.9" opacity="0.4"/><circle cx="112" cy="228" r="0.6" opacity="0.3"/>
    <circle cx="40" cy="112" r="0.5" opacity="0.25"/><circle cx="240" cy="70" r="0.5" opacity="0.25"/>
    <circle cx="370" cy="140" r="0.5" opacity="0.25"/><circle cx="200" cy="170" r="0.5" opacity="0.2"/>
    <circle cx="320" cy="90" r="0.5" opacity="0.2"/><circle cx="140" cy="40" r="0.5" opacity="0.25"/>
  </g>

  <!-- constellation bonds (thin, delicate) -->
  <g stroke="#f9a8d4" stroke-width="1.3" opacity="0.55" stroke-linecap="round">
    <!-- benzene ring -->
    <line x1="188" y1="120" x2="164" y2="161.6"/>
    <line x1="164" y1="161.6" x2="116" y2="161.6"/>
    <line x1="116" y1="161.6" x2="92" y2="120"/>
    <line x1="92" y1="120" x2="116" y2="78.4"/>
    <line x1="116" y1="78.4" x2="164" y2="78.4"/>
    <line x1="164" y1="78.4" x2="188" y2="120"/>
    <!-- aromatic inner hints -->
    <line x1="176" y1="126" x2="158" y2="152" opacity="0.5" stroke-width="1"/>
    <line x1="122" y1="152" x2="104" y2="126" opacity="0.5" stroke-width="1"/>
    <line x1="122" y1="88" x2="158" y2="88" opacity="0.5" stroke-width="1"/>
    <!-- hydroxyl bonds -->
    <line x1="116" y1="78.4" x2="92" y2="48"/>
    <line x1="164" y1="78.4" x2="188" y2="48"/>
    <!-- ethylamine side chain -->
    <line x1="188" y1="120" x2="232" y2="120"/>
    <line x1="232" y1="120" x2="276" y2="120"/>
    <line x1="276" y1="120" x2="320" y2="120"/>
  </g>

  <!-- carbon stars (benzene ring) -->
  <g>
    <circle cx="188" cy="120" r="11" fill="url(#starGlow)"/><circle cx="188" cy="120" r="3.6" fill="#fff1f9"/>
    <circle cx="164" cy="161.6" r="11" fill="url(#starGlow)"/><circle cx="164" cy="161.6" r="3.6" fill="#fff1f9"/>
    <circle cx="116" cy="161.6" r="11" fill="url(#starGlow)"/><circle cx="116" cy="161.6" r="3.6" fill="#fff1f9"/>
    <circle cx="92" cy="120" r="11" fill="url(#starGlow)"/><circle cx="92" cy="120" r="3.6" fill="#fff1f9"/>
    <circle cx="116" cy="78.4" r="11" fill="url(#starGlow)"/><circle cx="116" cy="78.4" r="3.6" fill="#fff1f9"/>
    <circle cx="164" cy="78.4" r="11" fill="url(#starGlow)"/><circle cx="164" cy="78.4" r="3.6" fill="#fff1f9"/>
    <!-- side chain carbons -->
    <circle cx="232" cy="120" r="10" fill="url(#starGlow)"/><circle cx="232" cy="120" r="3.2" fill="#fff1f9"/>
    <circle cx="276" cy="120" r="10" fill="url(#starGlow)"/><circle cx="276" cy="120" r="3.2" fill="#fff1f9"/>
  </g>

  <!-- oxygen stars (with sparkle) -->
  <g>
    <circle cx="92" cy="48" r="14" fill="url(#oGlow)"/><circle cx="92" cy="48" r="4.4" fill="#fff1f2"/>
    <path d="M92,35 C93.5,44 94,44.5 103,48 C94,51.5 93.5,52 92,61 C90.5,52 90,51.5 81,48 C90,44.5 90.5,44 92,35 Z" fill="#fda4af" opacity="0.9"/>
    <circle cx="188" cy="48" r="14" fill="url(#oGlow)"/><circle cx="188" cy="48" r="4.4" fill="#fff1f2"/>
    <path d="M188,35 C189.5,44 190,44.5 199,48 C190,51.5 189.5,52 188,61 C186.5,52 186,51.5 177,48 C186,44.5 186.5,44 188,35 Z" fill="#fda4af" opacity="0.9"/>
  </g>

  <!-- nitrogen star (with sparkle) -->
  <g>
    <circle cx="320" cy="120" r="14" fill="url(#nGlow)"/><circle cx="320" cy="120" r="4.4" fill="#f5f3ff"/>
    <path d="M320,107 C321.5,116 322,116.5 331,120 C322,123.5 321.5,124 320,133 C318.5,124 318,123.5 309,120 C318,116.5 318.5,116 320,107 Z" fill="#c4b5fd" opacity="0.9"/>
  </g>

  <!-- constellation label -->
  <text x="240" y="242" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="6" fill="#f9a8d4" opacity="0.75">DOPAMINE</text>
  <text x="240" y="256" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" letter-spacing="3" fill="#f9a8d4" opacity="0.45">C8H11NO2</text>
</svg>
