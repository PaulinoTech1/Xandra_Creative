<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark cosmic background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bgGrad)" />

  <!-- Cyan/purple ring border -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.9" />

  <!-- Bold "X" lettermark with gradient and glow -->
  <text
    x="16"
    y="21"
    font-family="Georgia, serif"
    font-size="18"
    font-weight="700"
    text-anchor="middle"
    fill="url(#xGrad)"
    filter="url(#glow)"
  >X</text>
</svg>
